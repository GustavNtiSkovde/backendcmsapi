<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div>
        <div>
            <h3>Sidor skapade</h3>
            <form>
                <input id="TitleForSite" type="text" placeholder="Title for site">
                <input id="ContentForSite" type="text" placeholder="Content for site">
                <input id="NameOfImg" type="text" placeholder="Name of Img (e.g. pic.png)">
                <input id="AltTxtForImg" type="text" placeholder="Alt text for img">

                <select id="CategoryForSite" required>
                    <option value="">Select Category</option>
                    <option value="News">News</option>
                    <option value="Blog">Blog</option>
                    <option value="Products">Products</option>
                    <option value="Bajs">Bajs</option>
                </select>

                <select id="LangForSite" required>
                    <option value="">Select Language</option>
                    <option value="Svenska">Svenska (sv)</option>
                    <option value="Engelska">English (en)</option>
                </select>
            </form>
            
            <button id="AddSideBtn">Add side</button> 
        </div>
        <div id="ViewSitesBox" class="scroll-view"></div>
    </div>
</body>
</html>
