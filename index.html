<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div>
        <div>
            <h3>Sidor skapade</h3>
            <form>
                <fieldset>
                    <legend>Svenska</legend>
                    <input id="SvTitle" type="text" placeholder="Titel">
                    <input id="SvContent" type="text" placeholder="Innehåll">
                </fieldset>

                <fieldset>
                    <legend>English</legend>
                    <input id="EnTitle" type="text" placeholder="Title">
                    <input id="EnContent" type="text" placeholder="Content">
                </fieldset>
                
                <input id="NameOfImg" type="text" placeholder="Name of Img (e.g. pic.png)">
                <input id="AltTxtForImg" type="text" placeholder="Alt text for img">

                <select id="CategoryForSite" required>
                    <option value="">Select Category</option>
                    <option value="News">News</option>
                    <option value="Blog">Blog</option>
                    <option value="Products">Products</option>
                </select>
            </form>
            <button id="AddSideBtn">Add side</button>
        </div>
        <div id="ViewSitesBox" class="scroll-view"></div>
    </div>
</body>
</html>
